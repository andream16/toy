tasks:
  vendor:
    name: Install dependencies
    description: Download Go module vendors.
    command: |
      go mod vendor
    triggeredBy:
      - postDevcontainerStart

  test:
    name: Run tests
    description: Format and run all Go tests.
    command: |
      go fmt ./...
      go test -vet all ./... -count=1 -race
    triggeredBy:
      - manual
    dependsOn:
      - vendor

services:
  dev-server:
    name: Dev Server
    description: Run the application via docker-compose on port 8080.
    commands:
      start: |
        docker compose up --build
      ready: |
        curl -sf http://localhost:8080
      stop: |
        docker compose down --rmi local
