tasks:
  vendor:
    name: Vendor Go dependencies
    command: |
      go mod vendor
    triggeredBy:
      - manual

  test:
    name: Run tests
    command: |
      make test
    triggeredBy:
      - manual

  build:
    name: Build Docker image
    command: |
      go mod vendor
      docker build .
    triggeredBy:
      - manual

services:
  toy:
    name: Toy API
    description: Runs the Toy HTTP API on port 8080.
    commands:
      start: |
        go mod vendor
        docker compose up --build
      ready: |
        curl --fail --silent http://localhost:8080/ >/dev/null
      stop: |
        docker compose down --remove-orphans
    triggeredBy:
      - manual
