tasks:
  install:
    name: Install dependencies
    command: |
      go mod download
    triggeredBy:
      - manual

  test:
    name: Run tests
    command: |
      go fmt ./...
      go test -vet all ./... -count=1 -race
    triggeredBy:
      - manual

  build:
    name: Build application
    command: |
      go build -o /tmp/toy ./cmd/toy
    triggeredBy:
      - manual

services:
  toy:
    name: Toy API
    description: Runs the toy HTTP API on port 8080.
    commands:
      start: |
        go run ./cmd/toy
      ready: |
        curl --fail --silent --show-error http://localhost:8080/ >/dev/null
    triggeredBy:
      - manual
